services:
  telecom-advisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom-churn-advisor
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data/docs:/app/data/docs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  rag-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom-rag-indexer
    entrypoint: ["python", "-m", "src.rag.indexer"]
    env_file:
      - .env
    volumes:
      - ./data/docs:/app/data/docs
    profiles:
      - setup
