name: Build, Push and Deploy to Azure Container Apps

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "notebooks/**"
      - "docs/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ryvelts/telco-churn-advisor-aie2-ds3:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Revision to Azure Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name telco-churn-advisor-aie2-ds3 \
              --resource-group resource1 \
              --image docker.io/ryvelts/telco-churn-advisor-aie2-ds3:latest
